<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peninsula</title>
    <link rel="stylesheet" href="peninsula.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poetsen+One&display=swap" rel="stylesheet">
</head>

<body class="home">

    <div class="header">

        <div class="logo">
            <img src="image/logo.png">
        </div>

        <div class="search">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search">
        </div>

        <div class="order">
             <i class="fa-solid fa-receipt"></i>
             My Order
        </div>

    </div>

    <div class="nav-top">
        <div>HOME</div>
        <div>SHOP</div>
        <div>STORY</div>
        <div>CART</div>
    </div>

    <div class="main">

        <div class="text">
            NOURISH.<br>
            CLEANSE.<br>
            DETOXIFY.<br>
            REGENERATE.
        </div>

        <div class="quote">
            -- Peninsula Cold Press Juices
        </div>

        <button class="btn">SHOP</button>

    </div>

    <div class="nav-bottom">
        <h2>Home</h2>
        <div>Shop</div>
        <div>Story</div>
        <div>Cart</div>
    </div>

</body>
</html>
