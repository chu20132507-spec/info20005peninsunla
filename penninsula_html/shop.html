<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>peninsula_shop</title>
    <link rel="stylesheet" href="../style/peninsula.css">
    <script src="../peninsula_js/search_dropdown.js"></script>
    <script src="../peninsula_js/filter.js"></script>
    <script src="../peninsula_js/category.js"></script>
    <script src="../peninsula_js/search.js"></script>
    <script src="../peninsula_js/detail_product_data.js "></script>
    <script src="../peninsula_js/detail.js"></script>
    <script src="../peninsula_js/add_cart.js"></script>
    <script src="../peninsula_js/cart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poetsen+One&display=swap" rel="stylesheet">
</head>
<body class="shop">
    <header class="header">

        <div class="logo">
            <img src="../image/logo.png" alt="logo">
        </div>

        <div class="search-wrapper">

    <!--search bar-->
    <div class="search-bar" id="searchBar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search" id="searchInput">
        <button id="searchBtn">
            <i class="fa-solid fa-arrow-right"></i>
        </button>
    </div>

    <!--search interaction-->
    <div class="search-dropdown" id="searchDropdown">
        <div class="recent-top">
                <div class="recent-title">
                    <i class="fa-regular fa-clock"></i>
                    <span>Recent searches</span>
                </div>

                <i class="fa-regular fa-trash-can clear-icon"></i>
            </div>

            <div class="recent-tags">
                <button>Green</button>
                <button>Carrot</button>
            </div>
        </div>
    </div>

    <!--negative buttons-->
    <div class="faq">F.A.Q.S</div>
    <a href="myorder.html" class="order">
        <i class="fa-solid fa-receipt"></i>
        My Order
    </a>

    </header>

    <!--navigation bar-->
    <nav class="nav-top">
        <a href="index.html">HOME</a>
        <a href="shop.html" class="current">SHOP</a>
        <a href="#">STORY</a>
        <a href="cart.html" class="cart-link">
            CART
            <span id="cartBadge" class="cart-badge">0</span>
        </a>
    </nav>

    <main class="shop-main">
        <p id="resultText"></p>
        <!--title-->
        <section class="shop-heading">
            <a href="index.html" class="back-btn">
                <i class="fa-solid fa-chevron-left"></i>
                Back
            </a>
            <h1>SHOP</h1>
        </section>

        <!--categories filter-->
        <section class="category-wrapper">
            <section class="category" id="categoryBtn">
                <p> 
                    <i class="fa-solid fa-sliders"></i>
                    All Products
                </p>
            </section>
            <section class="category-dropdown" id="categoryDropdown">
                <button data-filter="all">All Products</button>
                <button data-filter="juice">Juice</button>
                <button data-filter="cleanse">Cleanse Range</button>
                <button data-filter="retail">Retail Range</button>
            </section>
        </section> 

        <!--sort-->
        <nav class="sort-bar">
            <button class="sort-btn active">Featured</button>
            <button class="sort-btn">Lowest</button>
            <button class="sort-btn">Highest</button>
            <button class="sort-btn">Newest</button>
        </nav>

        <!--cleanse-->
        <section class="product-section" id="cleanseSection">
            <h2 class="cleanse-title">
                CLEANSE RANGE
            </h2>

            <section class="product-grid">
                <figure class="product-card" data-price="65" onclick="window.location.href='detail.html?product=cleanse1'">
                    <img src="../image/Peninsula_Cleanse1.jpg" alt="Cleanse Juice1">
                    <figcaption>
                        <h3>CLEANSE #1</h3>
                        <section class="product-bottom">
                            <p>$65.00</p>
                            <p class="rating">
                                <i class="fa-solid fa-star"></i>
                                2.5
                            </p>
                        </section>
                    </figcaption>
                </figure>

                <figure class="product-card" data-price="65" onclick="window.location.href='detail.html?product=cleanse2'">
                    <img src="../image/Peninsula_Cleanse2.jpg" alt="Cleanse Juice2">
                    <figcaption>
                        <h3>CLEANSE #2</h3>
                        <section class="product-bottom">
                            <p>$65.00</p>
                            <p class="rating">
                                <i class="fa-solid fa-star"></i>
                                3.0
                            </p>
                        </section>
                    </figcaption>
                </figure>

                <figure class="product-card" data-price="65" onclick="window.location.href='detail.html?product=cleanse3'">
                    <img src="../image/Peninsula_Cleanse3.jpg" alt="Cleanse Juice3">
                    <figcaption>
                        <h3>CLEANSE #3</h3>
                        <section class="product-bottom">
                            <p>$65.00</p>
                            <p class="rating">
                            </p>
                        </section>
                    </figcaption>
                </figure>
            </section>
        </section>
    
        <!--juice-->
        <section class="product-section" id="juiceSection">
            <h2 class="juice-title">
                JUICE
            </h2>
            <section class="product-grid">
                <!--product-->
                
                <figure class="product-card" data-price="8" onclick="window.location.href='detail.html?product=carrot1'">
                    <img src="../image/Peninsula_Carrot1B-removebg-preview.png" alt="Carrot Juice">
                    <figcaption>
                        <h3>CARROT #1</h3>
                        <section class="product-bottom">
                            <p>$8.50</p>
                            <p class="rating">
                                <i class="fa-solid fa-star"></i>
                                1.0
                            </p>
                        </section>
                    </figcaption>
                </figure>
                
                <!--product-->
                <figure class="product-card" data-price="8" onclick="window.location.href='detail.html?product=carrot2'">
                    <img src="../image/Peninsula_Carrot2B-removebg-preview.png" alt="Carrot Juice">
                    <figcaption>
                        <h3>CARROT #2</h3>
                        <section class="product-bottom">
                            <p>$8.50</p>
                            <p class="rating">
                                <i class="fa-solid fa-star"></i>
                                3.0
                            </p>
                        </section>
                    </figcaption>
                </figure>

                <!--sold out-->
                <figure class="product-card sold-out" data-price="8" onclick="window.location.href='detail.html?product=hydrate'">
                    <p class="sold-label">
                        SOLD OUT
                    </p>
                    <img src="../image/Peninsula_Hydrate-removebg-preview.png" alt="Hydrate">
                    <figcaption>
                        <h3>HYDRATE</h3>
                        <section class="product-bottom">
                            <p>$8.50</p>
                            <p class="rating">
                                <i class="fa-solid fa-star"></i>
                                3.0
                            </p>
                        </section>
                    </figcaption>
                </figure>
            </section>
        </section>
        <!--retail-->
        <section class="product-section" id="retailSection">
            <h2 class="retail-title">RETAIL RANGE</h2>
            <section class="product-grid">
                <!--product-->
                <figure class="product-card" data-price="8" onclick="window.location.href='detail.html?product=blackLemonade'">
                    <img src="../image/Peninsula_BlackLemonade.jpg" alt="BLK Lemonade">
                    <figcaption>
                        <h3>BLK LEMONADE</h3>
                        <section class="product-bottom">
                            <p>$8.50</p>
                            <p class="rating">
                                <i class="fa-solid fa-star"></i>
                                2.0
                            </p>
                        </section>
                    </figcaption>
                </figure>

                <!--product-->
                <figure class="product-card" data-price="8" onclick="window.location.href='detail.html?product=beet'">
                    <img src="../image/Peninsula_BeetB.jpg" alt="Peninsula_BeetB">
                    <figcaption>
                        <h3>BEET</h3>
                        <section class="product-bottom">
                            <p>$8.50</p>
                            <p class="rating">
                            </p>
                        </section>
                    </figcaption>
                </figure>

            </section>
        </section>

       </main>
        
    <!--mobile navigation-->
    <div class="nav-bottom">
        <a href="index.html">
            <i class="fa-solid fa-house"></i>
            <span>HOME</span>
        </a>

        <a href="shop.html" class="active">
            <i class="fa-solid fa-store"></i>
            <span>SHOP</span>
        </a>

        <a href="#">
            <i class="fa-solid fa-book-open"></i>
            <span>STORY</span>
        </a>

        <a href="cart.html" class="mobile-cart">

            <div class="mobile-cart-wrapper">

                <i class="fa-solid fa-cart-shopping"></i>

                <span id="mobileCartBadge" class="mobile-cart-badge"> 0 </span>
            </div>
            <span>CART</span>

        </a>
    </div>
</body>
</html>
