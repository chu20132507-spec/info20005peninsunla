<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>peninsula_detail</title>
    <link rel="stylesheet" href="style/peninsula.css">
    <script src="peninsula_js/search_dropdown.js"></script>
    <script src="peninsula_js/search.js"></script>
    <script src="peninsula_js/detail_product_data.js "></script>
    <script src="peninsula_js/detail.js"></script>
    <script src="peninsula_js/add_cart.js"></script>
    <script src="peninsula_js/cart.js"></script>
    <script src="peninsula_js/delivery.js"></script>
    <script src="peninsula_js/continuecheckout.js"></script>
    <script src="peninsula_js/purchase.js"></script>
    <script src="peninsula_js/success.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poetsen+One&display=swap" rel="stylesheet">
</head>
<body>
    <body class="cart">
    <!--header-->
    <header class="header">

        <div class="logo">
            <img src="image/logo.png" alt="logo">
        </div>

        <div class="search-wrapper">

            <!--search bar-->
            <div class="search-bar" id="searchBar">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input type="text" placeholder="Search" id="searchInput">

                <button id="searchBtn">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </div>

            <!--search dropdown-->
            <div class="search-dropdown" id="searchDropdown">

                <div class="recent-top">

                    <div class="recent-title">
                        <i class="fa-regular fa-clock"></i>
                        <span>Recent searches</span>
                    </div>

                    <i class="fa-regular fa-trash-can clear-icon"></i>

                </div>

                <div class="recent-tags">
                    <button>Green</button>
                    <button>Carrot</button>
                </div>

            </div>

        </div>

        <!--header buttons-->
        <div class="faq">F.A.Q.S</div>

        <a href="myorder.html" class="order">
            <i class="fa-solid fa-receipt"></i>
            My Order
        </a>

    </header>
    <main class="success-main">

    <section class="success-container">

        <div class="circle-green-small"></div>
        <div class="circle-green-large"></div>
        <div class="circle-blue-small"></div>
        <div class="circle-blue-large"></div>
        <div class="circle-orange-small"></div>
        <div class="circle-orange-large"></div>
        <div class="circle-green-medium"></div>
        <div class="circle-orange-medium"></div>

        <section class="success-card">

            <h1>SUCCESS!</h1>

            <p class="success-message">
                Thank you for your purchase.
            </p>

            <p class="success-message">
                We are preparing your order.
            </p>

            <p class="delivery-message">
                Estimated delivery: Monday - Wednesday (1-3 business days)
            </p>

            <p class="order-message">
                You can view your order status
                in My Order.
            </p>

        </section>

    </section>

</main>
</body>
</html>
