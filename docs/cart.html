<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>peninsula_detail</title>
    <link rel="stylesheet" href="../style/peninsula.css">
    <script src="../peninsula_js/search_dropdown.js"></script>
    <script src="../peninsula_js/search.js"></script>
    <script src="../peninsula_js/detail_product_data.js"></script>
    <script src="../peninsula_js/detail.js"></script>
    <script src="../peninsula_js/add_cart.js"></script>
    <script src="../peninsula_js/cart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poetsen+One&display=swap" rel="stylesheet">
</head>
<body class="cart">

    <!--header-->
    <header class="header">

        <div class="logo">
            <img src="../image/logo.png" alt="logo">
        </div>

        <div class="search-wrapper">

            <!--search bar-->
            <div class="search-bar" id="searchBar">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input type="text" placeholder="Search" id="searchInput">

                <button id="searchBtn">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </div>

            <!--search dropdown-->
            <div class="search-dropdown" id="searchDropdown">

                <div class="recent-top">

                    <div class="recent-title">
                        <i class="fa-regular fa-clock"></i>
                        <span>Recent searches</span>
                    </div>

                    <i class="fa-regular fa-trash-can clear-icon"></i>

                </div>

                <div class="recent-tags">
                    <button>Green</button>
                    <button id="carrotHistory">Carrot</button>
                </div>

            </div>

        </div>

        <!--header buttons-->
        <div class="faq">F.A.Q.S</div>

        <a href="myorder.html" class="order">
            <i class="fa-solid fa-receipt"></i>
            My Order
        </a>

    </header>

    <!--navigation-->
    <nav class="nav-top">

        <a href="../index.html">HOME</a>
        <a href="shop.html">SHOP</a>
        <a href="#">STORY</a>
        <a href="cart.html" class="cart-link current">
            CART
            <span id="cartBadge" class="cart-badge">0</span>
        </a>

    </nav>
    
    <main class="cart-main">

        <section class="cart-heading">

            <a href="shop.html" class="back-btn">
                <i class="fa-solid fa-chevron-left"></i>
                Back
            </a>

            <section class="cart-step">
                <span class="step-active">Select</span>
                <span>—— Delivery Info —— Pay</span>
            </section>

        </section>

        <section class="cart-divider"></section>

        <section id="cartContainer" class="cart-products">
        </section>

        <section class="cart-summary">

            <h2>Subtotal:</h2>

            <section id="subtotalContainer">
            </section>

            <section class="cart-total">
                <p>Total</p>
                <p id="totalPrice">$0.00</p>
            </section>

        </section>

        <button class="checkout-btn" id="checkoutBtn">
            Checkout
        </button>

    </main>

    <!--mobile navigation-->
    <div class="nav-bottom">

        <a href="../index.html">

            <i class="fa-solid fa-house"></i>
            <span>HOME</span>

        </a>

        <a href="shop.html">

            <i class="fa-solid fa-store"></i>
            <span>SHOP</span>

        </a>

        <a href="#">

            <i class="fa-solid fa-book-open"></i>
            <span>STORY</span>

        </a>

        <a href="cart.html" class="mobile-cart active">

            <div class="mobile-cart-wrapper">

                <i class="fa-solid fa-cart-shopping"></i>

                <span id="mobileCartBadge" class="mobile-cart-badge"> 0 </span>
            </div>
            <span>CART</span>

        </a>

    </div>

</body>
</html>
