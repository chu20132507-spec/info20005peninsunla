<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>peninsula_detail</title>
    <link rel="stylesheet" href="../style/peninsula.css">
    <script src="../peninsula_js/search_dropdown.js"></script>
    <script src="../peninsula_js/search.js"></script>
    <script src="../peninsula_js/detail_product_data.js "></script>
    <script src="../peninsula_js/detail.js"></script>
    <script src="../peninsula_js/add_cart.js"></script>
    <script src="../peninsula_js/cart.js"></script>
    <script src="../peninsula_js/delivery.js"></script>
    <script src="../peninsula_js/continuecheckout.js"></script>
    <script src="../peninsula_js/purchase.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poetsen+One&display=swap" rel="stylesheet">
</head>
<body class="cart">
    <!--header-->
    <header class="header">

        <div class="logo">
            <img src="../image/logo.png" alt="logo">
        </div>

        <div class="search-wrapper">

            <!--search bar-->
            <div class="search-bar" id="searchBar">

                <i class="fa-solid fa-magnifying-glass"></i>

                <input type="text" placeholder="Search" id="searchInput">

                <button id="searchBtn">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </div>

            <!--search dropdown-->
            <div class="search-dropdown" id="searchDropdown">

                <div class="recent-top">

                    <div class="recent-title">
                        <i class="fa-regular fa-clock"></i>
                        <span>Recent searches</span>
                    </div>

                    <i class="fa-regular fa-trash-can clear-icon"></i>

                </div>

                <div class="recent-tags">
                    <button>Green</button>
                    <button>Carrot</button>
                </div>

            </div>

        </div>

        <!--header buttons-->
        <div class="faq">F.A.Q.S</div>

        <a href="myorder.html" class="order">
            <i class="fa-solid fa-receipt"></i>
            My Order
        </a>

    </header>

    <main class="cart-main">

        <section class="cart-heading">

            <a href="delivery.html" class="back-btn">
                <i class="fa-solid fa-chevron-left"></i>
                Back
            </a>

            <section class="cart-step">
                <span>Select —— Delivery Info —— </span>
                <span class="step-active">Pay</span>
            </section>

        </section>

        <section class="purchase-layout">

            <!--order summary-->
            <section class="order-summary-bg">

                <section class="order-summary">

                    <h2>Your Order</h2>

                    <section id="purchaseItems"></section>
                    <hr>

                    <div class="summary-row">
                        <p>Subtotal</p>
                        <p id="subtotalPrice">$0.00</p>
                    </div>

                    <div class="summary-row">
                        <p>Shipping Fee</p>
                        <p>$10.00</p>
                    </div>
                    <hr>

                    <div class="summary-total">
                        <p>Total</p>
                        <p id="totalPrice">$0.00</p>
                    </div>

                </section>

            </section>

            <section class="payment-wrapper">

                <section class="payment-notice">
                    <h2>
                        Choose A Payment Method
                        <i class="fa-regular fa-credit-card"></i>
                    </h2>
                </section>

                <section class="payment-form">

                    <div id="googlePayBtn" class="google-pay-option">
                        <img src="../image/googlepay.png" alt="Google Pay">
                    </div>

                    <div class="payment-divider">
                        <span></span>
                        <p>OR</p>
                        <span></span>
                    </div>

                    <section class="card-payment">

                        <h3>By Card</h3>

                        <div class="payment-field">
                            <label for="cardName">Name on Card</label>
                            <input type="text" id="cardName">
                        </div>

                        <div class="payment-field">
                            <label for="cardNumber">Card Number</label>
                            <input type="text" id="cardNumber">
                        </div>

                        <section class="payment-row">

                            <div class="payment-field">
                                <label for="expiryDate">Expiry Date</label>
                                <input type="text" id="expiryDate" placeholder="MM/YY">
                            </div>

                            <div class="payment-field">
                                <label for="cvv">CVV</label>
                                <input type="text" id="cvv" placeholder="e.g.000">
                            </div>

                        </section>
                    </section>
                </section>
            </section>
        </section>
        <button class="purchase-btn">PAY</button>

    </main>

</body>
</html>
