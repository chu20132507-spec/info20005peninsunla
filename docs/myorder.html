<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>peninsula_detail</title>
    <link rel="stylesheet" href="style/peninsula.css">
    <script src="peninsula_js/search_dropdown.js"></script>
    <script src="peninsula_js/search.js"></script>
    <script src="peninsula_js/detail_product_data.js "></script>
    <script src="peninsula_js/myorder.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poetsen+One&display=swap" rel="stylesheet">
</head>
<body class="myorder">

    <!--header-->
    <header class="header">
        <div class="logo">
            <img src="image/logo.png" alt="logo">
        </div>

        <div class="search-wrapper">

            <div class="search-bar" id="searchBar">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" placeholder="Search" id="searchInput">
                <button id="searchBtn">
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </div>

            <div class="search-dropdown" id="searchDropdown">

                <div class="recent-top">

                    <div class="recent-title">
                        <i class="fa-regular fa-clock"></i>
                        <span>Recent searches</span>
                    </div>

                    <i class="fa-regular fa-trash-can clear-icon"></i>

                </div>

                <div class="recent-tags">
                    <button>Green</button>
                    <button>Carrot</button>
                </div>

            </div>

        </div>

        <div class="faq">
            F.A.Q.S
        </div>

        <a href="myorder.html" class="order">
            <i class="fa-solid fa-receipt"></i>
            My Order
        </a>

    </header>

   <main class="order-main">

        <a href="javascript:history.back()" class="back-btn">
            <i class="fa-solid fa-chevron-left"></i>
            Back
        </a>

        <h2 class="order-title">Your Recent Order</h2>
        <section class="order-card">

            <section class="order-status">

                <span class="status-badge" id="orderStatus">
                    IN PROGRESS
                </span>

                <span class="tracking-text">
                    <i class="fa-solid fa-truck-fast"></i>
                    <span class="tracking-done">
                        Packing --- Shipped
                    </span>
                    <span class="tracking-pending">
                        --- In Transit --- Arrived
                    </span>
                </span>
            </section>

            <!-- js -->
            <section class="orderItemsContainer" id="orderItemsContainer">

            </section>

            <section id="emptyOrder" class="empty-order">
                <h2>No Recent Orders</h2>
                <p>
                    Your completed orders will appear here.
                </p>
            </section>

            <hr>

            <section class="order-totals">

                <div class="summary-row">
                    <p>Subtotal</p>
                    <p id="orderSubtotal">$0.00</p>
                </div>

                <div class="summary-row">
                    <p>Shipping Fee</p>
                    <p>$10.00</p>
                </div>

                <div class="summary-total">
                    <p>Total</p>
                    <p id="orderTotal">$0.00</p>
                </div>

            </section>

            <hr class="delete-divider">

            <button class="delete-order-btn">
                Delete Order
            </button>

        </section>
    </main>

</body>

</html>
