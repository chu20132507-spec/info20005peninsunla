<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>peninsula_shop</title>
    <link rel="stylesheet" href="peninsula.css">
    <script src="peninsula2.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poetsen+One&display=swap" rel="stylesheet">
</head>
<body class="shop">
    <header class="header">

        <div class="logo">
            <img src="image/logo.png" alt="logo">
        </div>

        <div class="search-wrapper">

    <!--search bar-->
    <div class="search-bar" id="searchBar">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Search">
    </div>

    <!--search interaction-->
    <div class="search-dropdown" id="searchDropdown">
        <div class="recent-top">
                <div class="recent-title">
                    <i class="fa-regular fa-clock"></i>
                    <span>Recent searches</span>
                </div>

                <i class="fa-regular fa-trash-can clear-icon"></i>
            </div>

            <div class="recent-tags">
                <button>Green</button>
                <button>Carrot</button>
            </div>
        </div>
    </div>

    <!--negative buttons-->
    <div class="faq">F.A.Q.S</div>
    <div class="order"><i class="fa-solid fa-receipt"></i>My Order</div>

    </header>

    <!--navigation bar-->
    <nav class="nav-top">
        <a href="index.html" class="current">HOME</a>
        <a href="shop.html">SHOP</a>
        <a href="#">STORY</a>
        <a href="cart.html">CART</a>
    </nav>

    <main class="shop-main">

        <!--title-->
        <section class="shop-heading">
            <a href="index.html" class="back-btn">
                <i class="fa-solid fa-chevron-left"></i>
                Back
            </a>
            <h1>SHOP</h1>
        </section>

        <!--categories filter-->
        <section class="category">
            <p> 
                <i class="fa-solid fa-sliders"></i>
                All Products
            </p>
        </section>

        <!--sort-->
        <nav class="sort-bar">
            <button class="sort-btn active">
                Featured
            </button>

            <button class="sort-btn">
                Lowest
            </button>

            <button class="sort-btn">
                Highest
            </button>

            <button class="sort-btn">
                Newest
            </button>
        </nav>

        <!--juice-->
        <section class="product-section">
            <h2 class="section-title">
                JUICE
            </h2>
            <section class="product-grid">
                <!--product-->
                <figure class="product-card">
                    <img src="image/Peninsula_Carrot1B-removebg-preview.png" alt="Carrot Juice">
                    <figcaption>
                        <h3>CARROT #1</h3>
                        <section class="product-bottom">
                            <p>$8.50</p>
                            <p class="rating">
                                <i class="fa-solid fa-star"></i>
                                5.0
                            </p>
                        </section>
                    </figcaption>
                </figure>

                <!--product-->
                <figure class="product-card">
                    <img src="image/Peninsula_Carrot2B-removebg-preview.png" alt="Carrot Juice">
                    <figcaption>
                        <h3>CARROT #2</h3>
                        <section class="product-bottom">
                            <p>$8.50</p>
                            <p class="rating">
                                <i class="fa-solid fa-star"></i>
                                5.0
                            </p>
                        </section>
                    </figcaption>
                </figure>

                <!--sold out-->
                <figure class="product-card sold-out">
                    <p class="sold-label">
                        SOLD OUT
                    </p>
                    <img src="image/Peninsula_Hydrate-removebg-preview.png" alt="Hydrate">
                    <figcaption>
                        <h3>HYDRATE</h3>
                        <section class="product-bottom">
                            <p>$8.50</p>
                            <p class="rating">
                                <i class="fa-solid fa-star"></i>
                                4.6
                            </p>
                        </section>
                    </figcaption>
                </figure>
            </section>

        </section>

        <!--cleanse-->

        <section class="product-section">
            <h2 class="section-title blue">
                CLEANSE RANGE
            </h2>

            <section class="product-grid">
                <figure class="product-card">
                    <img src="image/cleanse1.png" alt="Cleanse Juice">
                    <figcaption>
                        <h3>CLEANSE #1</h3>
                        <section class="product-bottom">
                            <p>$65.00</p>
                            <p class="rating">
                                <i class="fa-solid fa-star"></i>
                                4.7
                            </p>
                        </section>
                    </figcaption>
                </figure>

                <figure class="product-card">
                    <img src="image/cleanse2.png" alt="Cleanse Juice">
                    <figcaption>
                        <h3>CLEANSE #2</h3>
                        <section class="product-bottom">
                            <p>$65.00</p>
                            <p class="rating">
                                <i class="fa-solid fa-star"></i>
                                4.8
                            </p>
                        </section>
                    </figcaption>
                </figure>

            </section>
        </section>
    </main>


    <!--mobile navigation-->
    <div class="nav-bottom">
        <a href="index.html">
            <i class="fa-solid fa-house"></i>
            <span>HOME</span>
        </a>

        <a href="shop.html" class="active">
            <i class="fa-solid fa-store"></i>
            <span>SHOP</span>
        </a>

        <a href="#">
            <i class="fa-solid fa-book-open"></i>
            <span>STORY</span>
        </a>

        <a href="#">
             <i class="fa-solid fa-cart-shopping"></i>
            <span>CART</span>
        </a>
    </div>
</body>
</html>
